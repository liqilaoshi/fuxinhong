<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小学四年级中文模拟考试（第七课《司马光》& 第八课《数星星的孩子》）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* 适合小学中文阅读与作答的字体与拼音排版样式 */
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f4f7fb;
      color: #1e293b;
    }
    .kaiti-text {
      font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
    }
    /* 拼音标注样式 */
    ruby {
      ruby-align: center;
      margin: 0 1px;
    }
    rt {
      font-size: 0.65em;
      color: #4f46e5;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    /* 田字格效果 */
    .tianzige {
      position: relative;
      background-color: #fff;
      border: 2px solid #dc2626;
      background-image:
        linear-gradient(to right, transparent 49%, #fca5a5 49%, #fca5a5 51%, transparent 51%),
        linear-gradient(to bottom, transparent 49%, #fca5a5 49%, #fca5a5 51%, transparent 51%);
      touch-action: none; /* 防止触屏手写时页面跟着滚动 */
    }
    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .page-fade {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 顶部试卷信息栏 -->
  <header class="bg-gradient-to-r from-indigo-600 via-blue-600 to-sky-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="bg-amber-400 text-slate-900 text-xs font-bold px-2.5 py-0.5 rounded-full">小学部 · 四年级</span>
            <span class="text-xs bg-white/20 px-2.5 py-0.5 rounded-full">满分 100 分</span>
          </div>
          <h1 class="text-lg sm:text-xl font-bold mt-1 tracking-wide">
            中文模拟考试 · 第七课《司马光》& 第八课《数星星的孩子》
          </h1>
        </div>

        <!-- 学生姓名与班级输入 -->
        <div class="flex flex-wrap items-center gap-2 bg-white/15 backdrop-blur-sm px-3 py-2 rounded-xl border border-white/20">
          <div class="flex items-center gap-1.5">
            <label for="studentName" class="text-xs font-medium text-blue-100 whitespace-nowrap">姓名：</label>
            <input id="studentName" type="text" placeholder="请输入姓名"
              class="w-24 sm:w-28 px-2 py-1 text-xs sm:text-sm rounded-lg bg-white text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-amber-300" />
          </div>
          <div class="flex items-center gap-1.5">
            <label for="studentClass" class="text-xs font-medium text-blue-100 whitespace-nowrap">班级：</label>
            <input id="studentClass" type="text" value="四年级"
              class="w-20 sm:w-24 px-2 py-1 text-xs sm:text-sm rounded-lg bg-white text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-amber-300" />
          </div>
          <div class="flex items-center gap-1 text-xs font-semibold bg-indigo-900/50 px-2.5 py-1 rounded-lg">
            <span>⏱</span>
            <span id="timerDisplay">00:00</span>
          </div>
        </div>
      </div>

      <!-- 多页步骤导航条（第1题 ~ 第9题 + 成绩单与错题本） -->
      <nav aria-label="试卷页码导航" class="mt-3 pt-2 border-t border-white/20 overflow-x-auto">
        <div id="navSteps" class="flex items-center gap-1.5 min-w-max pb-1">
          <!-- 由 JS 动态渲染 -->
        </div>
      </nav>
    </div>
  </header>

  <!-- 全局提示消息条（替代 alert） -->
  <div id="toastBanner" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium transition-all flex items-center gap-2">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMessage">提示信息</span>
  </div>

  <!-- 主内容区域 -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
    <div id="pageContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-8 page-fade">
      <!-- 动态渲染当前页面（第1~9部分或成绩单/错题本） -->
    </div>
  </main>

  <!-- 底部翻页控制栏 -->
  <footer class="bg-white border-t border-slate-200 sticky bottom-0 z-20 shadow-inner">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <button id="prevBtn" onclick="goPrevPage()"
        class="px-4 py-2.5 rounded-xl font-medium text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1.5">
        <span>←</span>
        <span>上一部分</span>
      </button>

      <div class="text-xs sm:text-sm text-slate-500 font-medium text-center" id="pageIndicator">
        第 1 / 9 部分
      </div>

      <div class="flex items-center gap-2">
        <button id="nextBtn" onclick="goNextPage()"
          class="px-5 py-2.5 rounded-xl font-medium text-sm bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition flex items-center gap-1.5">
          <span>下一部分</span>
          <span>→</span>
        </button>
        <button id="submitExamBtn" onclick="openConfirmModal()"
          class="hidden px-5 py-2.5 rounded-xl font-bold text-sm bg-emerald-600 text-white hover:bg-emerald-700 shadow-md transition flex items-center gap-1.5">
          <span>✓ 提交试卷并自动批改</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- 自定义确认提交模态框（禁止使用 confirm()） -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center gap-3 text-amber-600 mb-3">
        <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-xl">📝</div>
        <h3 class="text-lg font-bold text-slate-800">确认提交试卷吗？</h3>
      </div>
      <p id="confirmSummary" class="text-sm text-slate-600 leading-relaxed mb-5">
        系统将立即为你自动批改全卷（满分 100 分），并自动生成【专属错题本】。
      </p>
      <div class="flex justify-end gap-2.5">
        <button onclick="closeConfirmModal()"
          class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
          再检查一下
        </button>
        <button onclick="submitExam()"
          class="px-5 py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition">
          确认交卷并批改
        </button>
      </div>
    </div>
  </div>

      part1: [

        { id: "p1_6", pinyin: "nǔ lì", answer: "努力", hint: "第八课《数星星的孩子》：张衡___学习，成了天文学家", lesson: "第八课" }

    function startTimer() {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        if (!state.isSubmitted) {
          state.timerSeconds++;
          const mins = String(Math.floor(state.timerSeconds / 60)).padStart(2, "0");
          const secs = String(state.timerSeconds % 60).padStart(2, "0");
          const el = document.getElementById("timerDisplay");
          if (el) el.textContent = `${mins}:${secs}`;
        }
      }, 1000);

    function showToast(msg, type = "info") {
      const banner = document.getElementById("toastBanner");
      const icon = document.getElementById("toastIcon");
      const text = document.getElementById("toastMessage");
      const styles = {
        info: "bg-slate-800 text-white",
        success: "bg-emerald-600 text-white",
        warn: "bg-amber-500 text-slate-900"
      };
      const icons = { info: "ℹ️", success: "✅", warn: "⚠️" };
      banner.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 ${styles[type] || styles.info}`;
      icon.textContent = icons[type] || "ℹ️";
      text.textContent = msg;
      banner.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => banner.classList.add("hidden"), 2600);
    }

      if (state.currentPage > 1) {
        goToPage(state.currentPage - 1);

      if (state.currentPage < 9) {
        goToPage(state.currentPage + 1);
      } else if (state.isSubmitted && state.currentPage === 9) {
        goToPage(10);
      }
    }

      const a = state.answers;
      switch (secId) {
        case 1: return EXAM_DATA.part1.every(q => (a.part1[q.id] || "").trim().length > 0);
        case 2: return (a.part2.leftRight.length + a.part2.topBottom.length + a.part2.single.length) === 16;
        case 3: return Object.keys(a.part3).length === 5;
        case 4: return (a.part4.xin.length + a.part4.shi.length + a.part4.fei.length + a.part4.dou.length) === 16;
        case 5: return Object.keys(a.part5).length === 6;
        case 6: return Object.keys(a.part6).length === 5;
        case 7: return Object.values(a.part7).every(arr => arr.length > 0);
        case 8: return EXAM_DATA.part8.every(q => (a.part8[q.id] || "").trim().length > 0);
        case 9: return EXAM_DATA.part9.questions.every(q => (a.part9[q.id] || "").trim().length > 0);
        default: return false;
      }
    }

    /*************************************************************************

    // --- 第1部分：看拼音，写词语（12分 · 支持田字格手写 + 文本确认）---
    function renderPart1() {
      return `
        <!-- 笔触粗细调节栏 -->

    function setPenWidth(w) {
      state.penWidth = w;

    function initPart1HandwritingCanvases() {
      const canvases = document.querySelectorAll("canvas[id^='hw_']");
      canvases.forEach(canvas => {
        const key = canvas.dataset.key;
        const rect = canvas.getBoundingClientRect();
        const cssWidth = rect.width || 112;
        const cssHeight = rect.height || 112;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);

        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = state.penWidth;

        // 恢复已保存的笔迹（按归一化比例 0~1 存储，缩放不失真）
        redrawPart1Canvas(canvas, key);

        let activePointerId = null;
        let currentStroke = [];

        const getNormPos = (e) => {
          const r = canvas.getBoundingClientRect();
          const x = Math.max(0, Math.min(r.width, e.clientX - r.left));
          const y = Math.max(0, Math.min(r.height, e.clientY - r.top));
          return {
            x,
            y,
            nx: r.width > 0 ? x / r.width : 0,
            ny: r.height > 0 ? y / r.height : 0
          };
        };

        const handlePointerDown = (e) => {
          // 仅响应主按键或触控/手写笔，防止多指误触乱飞
          if (e.button !== 0 && e.pointerType === "mouse") return;
          if (activePointerId !== null) return;
          e.preventDefault();

          activePointerId = e.pointerId;
          try {
            canvas.setPointerCapture(e.pointerId);
          } catch (err) {}

          const pos = getNormPos(e);
          currentStroke = [{ nx: pos.nx, ny: pos.ny }];

          ctx.lineWidth = state.penWidth;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
          ctx.stroke();
        };

        const handlePointerMove = (e) => {
          if (e.pointerId !== activePointerId) return;
          e.preventDefault();

          const pos = getNormPos(e);
          const last = currentStroke[currentStroke.length - 1];
          const r = canvas.getBoundingClientRect();
          const lastX = last.nx * r.width;
          const lastY = last.ny * r.height;

          // 过滤微小抖动（小于 1.2px 的噪声点忽略）
          const dist = Math.hypot(pos.x - lastX, pos.y - lastY);
          if (dist < 1.2) return;

          currentStroke.push({ nx: pos.nx, ny: pos.ny });

          // 重绘当前画布以应用二次贝塞尔曲线平滑插值，避免折线棱角
          redrawPart1Canvas(canvas, key, currentStroke);
        };

        const finishStroke = (e) => {
          if (e.pointerId !== activePointerId) return;
          activePointerId = null;
          try {
            if (canvas.hasPointerCapture(e.pointerId)) {
              canvas.releasePointerCapture(e.pointerId);
            }
          } catch (err) {}

          if (currentStroke.length > 0) {
            if (!state.answers.part1Strokes[key]) {
              state.answers.part1Strokes[key] = [];
            }
            state.answers.part1Strokes[key].push({
              width: state.penWidth,
              points: currentStroke
            });
            currentStroke = [];
            redrawPart1Canvas(canvas, key);
          }
        };

        canvas.addEventListener("pointerdown", handlePointerDown);
        canvas.addEventListener("pointermove", handlePointerMove);
        canvas.addEventListener("pointerup", finishStroke);
        canvas.addEventListener("pointercancel", finishStroke);
      });
    }

    function drawSmoothStroke(ctx, points, w, h, lineWidth) {
      if (!points || points.length === 0) return;
      ctx.lineWidth = lineWidth || state.penWidth;
      ctx.beginPath();
      const p0x = points[0].nx * w;
      const p0y = points[0].ny * h;
      ctx.moveTo(p0x, p0y);

      if (points.length === 1) {
        ctx.lineTo(p0x + 0.1, p0y + 0.1);
      } else if (points.length === 2) {
        ctx.lineTo(points[1].nx * w, points[1].ny * h);
      } else {
        for (let i = 1; i < points.length - 1; i++) {
          const xc = ((points[i].nx + points[i + 1].nx) * 0.5) * w;
          const yc = ((points[i].ny + points[i + 1].ny) * 0.5) * h;
          ctx.quadraticCurveTo(points[i].nx * w, points[i].ny * h, xc, yc);
        }
        const last = points[points.length - 1];
        ctx.lineTo(last.nx * w, last.ny * h);
      }
      ctx.stroke();
    }

    function redrawPart1Canvas(canvas, key, livePoints = null) {
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const w = rect.width || 112;
      const h = rect.height || 112;
      const ctx = canvas.getContext("2d");

      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      const strokes = state.answers.part1Strokes[key] || [];
      strokes.forEach(s => {
        const pts = Array.isArray(s) ? s : s.points;
        const lw = Array.isArray(s) ? state.penWidth : s.width;
        drawSmoothStroke(ctx, pts, w, h, lw);
      });

      if (livePoints && livePoints.length > 0) {
        drawSmoothStroke(ctx, livePoints, w, h, state.penWidth);
      }
    }

    function undoPart1Stroke(key) {
      const strokes = state.answers.part1Strokes[key];
      if (strokes && strokes.length > 0) {
        strokes.pop();
        const canvas = document.getElementById(`hw_${key}`);
        redrawPart1Canvas(canvas, key);
      }

    // --- 第7部分：连词成句（10分）---
    function renderPart7() {
      return `
        <div class="space-y-5">
          ${EXAM_DATA.part7.map((q, idx) => {
            const chosenIndices = state.answers.part7[q.id] || [];
            const builtSentence = buildPart7Sentence(q, chosenIndices);
            return `
              <div class="p-4 sm:p-5 rounded-2xl border border-slate-200 bg-slate-50/70">

                    return `

                        class="px-3.5 py-2 rounded-xl border-2 font-bold text-base transition ${
                          isUsed
                            ? "border-slate-200 bg-slate-200/70 text-slate-400"
                            : "border-blue-300 bg-white text-slate-800 hover:border-indigo-600 hover:bg-indigo-50 shadow-xs"

                  }).join("")}

    function buildPart7Sentence(q, chosenIndices) {
      if (!chosenIndices || chosenIndices.length === 0) return "";
      const words = chosenIndices.map(i => q.tokens[i]);
      let raw = words.join("");
      // 针对第2题“他们有的做游戏，有的爬树。”自动补充逗号
      if (q.id === "p7_2" && chosenIndices.length === q.tokens.length) {
        raw = raw.replace(/(做游戏|爬树)(有的)/, "$1，$2");
      }
      if (chosenIndices.length === q.tokens.length && !raw.endsWith("。")) {
        raw += "。";
      }
      return raw;
    }

    function togglePart7Token(qId, tIdx) {
      const arr = state.answers.part7[qId] || [];
      if (arr.includes(tIdx)) {
        state.answers.part7[qId] = arr.filter(i => i !== tIdx);
      } else {
        state.answers.part7[qId] = [...arr, tIdx];
      }
      renderAll();
    }

    function popPart7Token(qId) {
      const arr = state.answers.part7[qId] || [];
      state.answers.part7[qId] = arr.slice(0, -1);
      renderAll();
    }

    function resetPart7(qId) {
      state.answers.part7[qId] = [];
      renderAll();
    }

    // --- 第8部分：读一读，组词语（10分）---
    function renderPart8() {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${EXAM_DATA.part8.map((q, idx) => {
            const val = state.answers.part8[q.id] || "";
            return `
              <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70 flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-amber-100 border-2 border-amber-300 flex items-center justify-center text-2xl font-bold kaiti-text text-amber-900 shrink-0">
                  ${q.char}
                </div>
                <div class="flex-1">
                  <div class="text-xs text-slate-400 mb-1">第 ${idx + 1} 题（2分）</div>
                  <input type="text" maxlength="6" value="${val}"
                    oninput="updatePart8('${q.id}', this.value)"
                    placeholder="用“${q.char}”组一个词语"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white font-bold text-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function updatePart8(qId, val) {
      state.answers.part8[qId] = val;
      renderNavAndFooter();
    }

    // --- 第9部分：阅读短文，完成练习（10分）---
    function renderPart9() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- 左侧短文阅读区 -->
          <div class="lg:col-span-6 bg-amber-50/60 border border-amber-200 rounded-2xl p-5 sm:p-6">
            <h3 class="text-center text-xl font-bold text-slate-900 mb-4 tracking-wider">
              ${EXAM_DATA.part9.title}
            </h3>
            <div class="space-y-4 text-base sm:text-lg leading-loose text-slate-800 indent-8">
              ${EXAM_DATA.part9.paragraphs.map(p => `<p>${p}</p>`).join("")}
            </div>
          </div>

          <!-- 右侧阅读理解题目区 -->
          <div class="lg:col-span-6 space-y-4">
            ${EXAM_DATA.part9.questions.map(q => {
              const val = state.answers.part9[q.id] || "";
              if (q.type === "radio") {
                return `
                  <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70">
                    <div class="font-bold text-slate-800 text-sm sm:text-base mb-2.5">${q.prompt}</div>
                    <div class="space-y-2">
                      ${q.options.map(opt => {
                        const isPicked = val === opt.label;
                        return `
                          <button onclick="updatePart9('${q.id}', '${opt.label}')"
                            class="w-full text-left px-3.5 py-2 rounded-xl border-2 text-sm font-medium transition flex items-center gap-2 ${
                              isPicked
                                ? "border-indigo-600 bg-indigo-600 text-white"
                                : "border-slate-200 bg-white text-slate-700 hover:border-indigo-300"
                            }">
                            <span class="font-bold">${opt.label}.</span>
                            <span>${opt.text}</span>
                          </button>
                        `;
                      }).join("")}
                    </div>
                  </div>
                `;
              } else {
                return `
                  <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70">
                    <div class="font-bold text-slate-800 text-sm sm:text-base mb-2">
                      ${q.prompt}${q.suffix ? `<span class="text-indigo-700">______</span>${q.suffix}` : ""}
                    </div>
                    <input type="text" value="${val}"
                      oninput="updatePart9('${q.id}', this.value)"
                      placeholder="请根据短文内容填写答案"
                      class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                  </div>
                `;
              }
            }).join("")}
          </div>
        </div>

    }

    function updatePart9(qId, val) {
      state.answers.part9[qId] = val;
      if (qId === "p9_3" || qId === "p9_4") {
        renderAll();
      } else {
        renderNavAndFooter();
      }
    }

    /*************************************************************************
     * 六、 交卷确认与全卷自动批改引擎（满分 100 分）
     *************************************************************************/
    function openConfirmModal() {
      const incompleteCount = EXAM_DATA.sections.filter(s => !isSectionCompleted(s.id)).length;
      const summaryEl = document.getElementById("confirmSummary");
      if (incompleteCount > 0) {
        summaryEl.innerHTML = `你还有 <span class="font-bold text-rose-600">${incompleteCount}</span> 个部分尚未全部填完。现在交卷系统将自动批改，未填题目会收入【错题本】方便练习，确定要交卷吗？`;
      } else {
        summaryEl.innerHTML = `太棒了！你已经完成了全部 9 个部分的作答。现在提交，系统将立即计算总分（满分 100 分）并生成专属错题本。`;
      }
      document.getElementById("confirmModal").classList.remove("hidden");
    }

    function closeConfirmModal() {
      document.getElementById("confirmModal").classList.add("hidden");
    }

    function normalizeText(str) {
      return (str || "").trim().replace(/\s+/g, "").replace(/[，。！？、,.!?]/g, "");
    }

    function submitExam() {
      closeConfirmModal();
      const a = state.answers;
      const wrongItems = [];
      const breakdown = [];
      let totalScore = 0;

      // 1. 批改第一部分（12分，每题2分）
      let s1 = 0;
      EXAM_DATA.part1.forEach((q, idx) => {
        const userAns = (a.part1[q.id] || "").trim();
        const isCorrect = userAns === q.answer;
        if (isCorrect) {
          s1 += 2;
        } else {
          wrongItems.push({
            uid: `p1_${q.id}`,
            section: "一、看拼音，写词语",
            questionText: `第 ${idx + 1} 题：看拼音【${q.pinyin}】写词语（${q.hint}）`,
            userAnswer: userAns || "（未作答）",
            correctAnswer: q.answer,
            acceptedList: [q.answer],
            explain: `拼音“${q.pinyin}”对应的课本重点词语是“${q.answer}”。`,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "一、看拼音，写词语", score: s1, full: 12 });
      totalScore += s1;

      // 2. 批改第二部分（16分，每字1分）
      let s2 = 0;
      EXAM_DATA.part2.categories.forEach(cat => {
        const userChars = a.part2[cat.key] || [];
        const rightOnes = userChars.filter(ch => cat.answers.includes(ch));
        s2 += rightOnes.length;
        if (rightOnes.length < cat.expectedCount || userChars.length !== rightOnes.length) {
          wrongItems.push({
            uid: `p2_${cat.key}`,
            section: "二、汉字结构分类",
            questionText: `找出属于【${cat.label}】的汉字（共 ${cat.expectedCount} 个）`,
            userAnswer: userChars.length > 0 ? userChars.join("、") : "（未作答）",
            correctAnswer: cat.answers.join("、"),
            acceptedList: [cat.answers.join("")],
            explain: cat.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "二、汉字结构分类", score: s2, full: 16 });
      totalScore += s2;

      // 3. 批改第三部分（10分，每组2分）
      let s3 = 0;
      EXAM_DATA.part3.leftItems.forEach((lItem, idx) => {
        const pickedRId = a.part3[lItem.id];
        const pairedR = EXAM_DATA.part3.rightItems.find(r => r.id === pickedRId);
        const userWord = pairedR ? `${lItem.char}${pairedR.text}` : "";
        if (pickedRId === lItem.matchRightId) {
          s3 += 2;
        } else {
          wrongItems.push({
            uid: `p3_${lItem.id}`,
            section: "三、连一连，组词语",
            questionText: `第 ${idx + 1} 组：为生字“${lItem.char}”连线组成课本词语`,
            userAnswer: userWord || "（未连线）",
            correctAnswer: lItem.word,
            acceptedList: [lItem.word],
            explain: `“${lItem.char}”与右侧词语搭配组成“${lItem.word}”。`,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "三、连一连，组词语", score: s3, full: 10 });
      totalScore += s3;

      // 4. 批改第四部分（16分，每字1分）
      let s4 = 0;
      EXAM_DATA.part4.groups.forEach(grp => {
        const userChars = a.part4[grp.key] || [];
        const rightOnes = userChars.filter(ch => grp.answers.includes(ch));
        s4 += rightOnes.length;
        if (rightOnes.length < 4) {
          wrongItems.push({
            uid: `p4_${grp.key}`,
            section: "四、找部首相同的字",
            questionText: `从云朵字库中找出部首为【${grp.radical}】的 4 个字`,
            userAnswer: userChars.length > 0 ? userChars.join("、") : "（未作答）",
            correctAnswer: grp.answers.join("、"),
            acceptedList: [grp.answers.join("")],
            explain: grp.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "四、找部首相同的字", score: s4, full: 16 });
      totalScore += s4;

      // 5. 批改第五部分（6分，每题1分）
      let s5 = 0;
      EXAM_DATA.part5.forEach((q, idx) => {
        const picked = a.part5[q.id];
        if (picked === q.answer) {
          s5 += 1;
        } else {
          const pickedOpt = q.options.find(o => o.label === picked);
          const rightOpt = q.options.find(o => o.label === q.answer);
          wrongItems.push({
            uid: `p5_${q.id}`,
            section: "五、单项选择",
            questionText: `第 ${idx + 1} 题：${q.question}`,
            userAnswer: pickedOpt ? `${pickedOpt.label}. ${pickedOpt.text}` : "（未选择）",
            correctAnswer: `${rightOpt.label}. ${rightOpt.text}`,
            acceptedList: [q.answer, rightOpt.text],
            explain: q.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "五、选择正确的答案填空", score: s5, full: 6 });
      totalScore += s5;

      // 6. 批改第六部分（10分，每空2分）
      let s6 = 0;
      EXAM_DATA.part6.items.forEach(item => {
        const userWord = a.part6[item.id] || "";
        if (userWord === item.answer) {
          s6 += 2;
        } else {
          wrongItems.push({
            uid: `p6_${item.id}`,
            section: "六、选词填空",
            questionText: `${item.prefix} ______ ${item.suffix}`,
            userAnswer: userWord || "（未填词）",
            correctAnswer: item.answer,
            acceptedList: [item.answer],
            explain: item.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "六、选词填空", score: s6, full: 10 });
      totalScore += s6;

      // 7. 批改第七部分（10分，每题2分）
      let s7 = 0;
      EXAM_DATA.part7.forEach((q, idx) => {
        const chosen = a.part7[q.id] || [];
        const userSentence = buildPart7Sentence(q, chosen);
        const normUser = normalizeText(userSentence);
        const validNorms = [q.answer, ...(q.altAnswers || [])].map(normalizeText);
        if (chosen.length === q.tokens.length && validNorms.includes(normUser)) {
          s7 += 2;
        } else {
          wrongItems.push({
            uid: `p7_${q.id}`,
            section: "七、连词成句",
            questionText: `第 ${idx + 1} 题：用【${q.tokens.join(" / ")}】连成通顺的句子`,
            userAnswer: userSentence || "（未连句）",
            correctAnswer: q.answer,
            acceptedList: [q.answer, ...(q.altAnswers || [])],
            explain: q.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "七、连词成句", score: s7, full: 10 });
      totalScore += s7;

      // 8. 批改第八部分（10分，每题2分）
      let s8 = 0;
      EXAM_DATA.part8.forEach((q, idx) => {
        const userWord = (a.part8[q.id] || "").trim();
        const isValid = userWord.length >= 2 && userWord.includes(q.char) && q.accepted.includes(userWord);
        if (isValid) {
          s8 += 2;
        } else {
          wrongItems.push({
            uid: `p8_${q.id}`,
            section: "八、读一读，组词语",
            questionText: `第 ${idx + 1} 题：用生字【${q.char}】组一个课本常见词语`,
            userAnswer: userWord || "（未组词）",
            correctAnswer: q.sample,
            acceptedList: q.accepted,
            explain: q.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "八、读一读，组词语", score: s8, full: 10 });
      totalScore += s8;

      // 9. 批改第九部分（10分，每题2分）
      let s9 = 0;
      EXAM_DATA.part9.questions.forEach(q => {
        const rawUser = (a.part9[q.id] || "").trim();
        let isCorrect = false;
        if (q.type === "radio") {
          isCorrect = rawUser === q.answer;
        } else if (q.keywords) {
          isCorrect = q.keywords.every(kw => rawUser.includes(kw));
        } else {
          const normU = normalizeText(rawUser);
          const validList = [q.answer, ...(q.altAnswers || [])].map(normalizeText);
          isCorrect = validList.includes(normU);
        }

        if (isCorrect) {
          s9 += 2;
        } else {
          let displayUser = rawUser || "（未作答）";
          let displayCorrect = q.answer;
          if (q.type === "radio") {
            const uOpt = q.options.find(o => o.label === rawUser);
            const cOpt = q.options.find(o => o.label === q.answer);
            displayUser = uOpt ? `${uOpt.label}. ${uOpt.text}` : "（未选择）";
            displayCorrect = `${cOpt.label}. ${cOpt.text}`;
          }
          wrongItems.push({
            uid: `p9_${q.id}`,
            section: "九、阅读短文《夜晚的天空》",
            questionText: q.prompt + (q.suffix || ""),
            userAnswer: displayUser,
            correctAnswer: displayCorrect,
            acceptedList: q.type === "radio" ? [q.answer, q.options.find(o => o.label === q.answer).text] : [q.answer, ...(q.altAnswers || [])],
            keywords: q.keywords || null,
            explain: q.explain,
            fixed: false
          });
        }
      });
      breakdown.push({ name: "九、阅读短文，完成练习", score: s9, full: 10 });
      totalScore += s9;

      state.isSubmitted = true;
      state.gradingResult = {
        totalScore,
        breakdown,
        submittedAt: new Date().toLocaleString("zh-CN"),
        duration: document.getElementById("timerDisplay").textContent
      };
      state.wrongBook = wrongItems;
      saveWrongBookToLocal();

      showToast(`批改完成！你的总分是 ${totalScore} / 100 分！`, "success");
      goToPage(10);
    }

    /*************************************************************************
     * 七、 成绩单与专属错题本渲染、在线订正、本地存储与导出
     *************************************************************************/
    function saveWrongBookToLocal() {
      try {
        localStorage.setItem("g4_chinese_exam_wrongbook", JSON.stringify({
          gradingResult: state.gradingResult,
          wrongBook: state.wrongBook
        }));
      } catch (e) {}
    }

    function loadSavedWrongBook() {
      try {
        const raw = localStorage.getItem("g4_chinese_exam_wrongbook");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.wrongBook) && parsed.wrongBook.length > 0) {
            state.wrongBook = parsed.wrongBook;
            state.gradingResult = parsed.gradingResult || null;
          }
        }
      } catch (e) {}
    }

    function renderResultAndWrongBookPage() {
      const res = state.gradingResult;
      const name = (document.getElementById("studentName")?.value || "").trim() || "同学";
      const cls = (document.getElementById("studentClass")?.value || "").trim() || "四年级";

      const totalWrong = state.wrongBook.length;
      const fixedCount = state.wrongBook.filter(w => w.fixed).length;
      const unfixedCount = totalWrong - fixedCount;

      const filteredList = state.wrongBook.filter(item => {
        if (state.wrongBookFilter === "unfixed") return !item.fixed;
        if (state.wrongBookFilter === "fixed") return item.fixed;
        return true;
      });

      let gradeBadge = { text: "继续加油 💪", color: "text-amber-600 bg-amber-50 border-amber-200" };
      if (res) {

        else if (res.totalScore >= 80) gradeBadge = { text: "良好 · 表现很棒 👍", color: "text-blue-700 bg-blue-50 border-blue-200" };
        else if (res.totalScore >= 60) gradeBadge = { text: "及格 · 再巩固一下错题 📖", color: "text-indigo-700 bg-indigo-50 border-indigo-200" };
      }

      return `
        <!-- 成绩单总览卡片 -->
        ${res ? `
          <div class="bg-gradient-to-br from-indigo-50 via-blue-50 to-sky-50 border border-indigo-200 rounded-2xl p-5 sm:p-6 mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-indigo-200/70 pb-5">
              <div>
                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold border ${gradeBadge.color} mb-2">
                  ${gradeBadge.text}
                </span>
                <h2 class="text-2xl font-bold text-slate-800">${cls} · ${name} 的模拟考试成绩单</h2>
                <p class="text-xs text-slate-500 mt-1">交卷时间：${res.submittedAt} ｜ 用时：${res.duration}</p>
              </div>
              <div class="flex items-center gap-4 bg-white px-6 py-4 rounded-2xl shadow-xs border border-indigo-100">
                <div class="text-center">
                  <div class="text-xs text-slate-400 font-medium">最终得分</div>
                  <div class="text-4xl font-extrabold text-indigo-600">${res.totalScore}<span class="text-base text-slate-400 font-normal"> / 100</span></div>
                </div>
                <div class="h-10 w-px bg-slate-200"></div>
                <div class="text-center">
                  <div class="text-xs text-slate-400 font-medium">错题数量</div>
                  <div class="text-2xl font-bold ${totalWrong === 0 ? "text-emerald-600" : "text-rose-600"}">${totalWrong} 题</div>
                </div>
              </div>
            </div>

            <!-- 九大题得分明细表 -->
            <div class="mt-4">
              <div class="text-xs font-bold text-slate-500 mb-2.5">各部分得分明细（总分 100 分）：</div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                ${res.breakdown.map(b => {
                  const isFull = b.score === b.full;
                  return `
                    <div class="bg-white px-3.5 py-2.5 rounded-xl border border-slate-200/80 flex items-center justify-between text-sm">
                      <span class="text-slate-700 font-medium truncate pr-2">${b.name}</span>
                      <span class="font-bold shrink-0 ${isFull ? "text-emerald-600" : "text-amber-600"}">
                        ${b.score} / ${b.full} 分
                      </span>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>
        ` : ""}

        <!-- 专属错题本区块 -->
        <div>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
            <div>
              <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span>📕 专属错题本</span>
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700">
                  待订正 ${unfixedCount} 题 · 已订正 ${fixedCount} 题
                </span>
              </h3>
              <p class="text-xs text-slate-500 mt-1">所有答错或未作答的题目已自动收录于此，可在下方直接输入正确答案进行在线订正。</p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button onclick="copyWrongBookText()"
                class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-white hover:bg-slate-700 transition">
                📋 复制错题本内容
              </button>
              <button onclick="retakeExam()"
                class="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition">
                🔄 重新再考一次
              </button>
            </div>
          </div>

          <!-- 筛选标签 -->
          ${totalWrong > 0 ? `
            <div class="flex items-center gap-2 mb-4">
              ${[
                { key: "all", label: `全部错题 (${totalWrong})` },
                { key: "unfixed", label: `待订正 (${unfixedCount})` },
                { key: "fixed", label: `已订正 (${fixedCount})` }
              ].map(tab => `
                <button onclick="setWrongBookFilter('${tab.key}')"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                    state.wrongBookFilter === tab.key
                      ? "bg-indigo-600 text-white"
                      : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                  }">
                  ${tab.label}
                </button>
              `).join("")}
            </div>
          ` : ""}

          <!-- 错题列表 -->
          ${totalWrong === 0 ? `
            <div class="text-center py-12 bg-emerald-50/60 border border-emerald-200 rounded-2xl">
              <div class="text-4xl mb-2">🏆</div>
              <div class="text-lg font-bold text-emerald-800">太厉害了！全卷 100 分满分，没有任何错题！</div>
              <p class="text-sm text-emerald-600 mt-1">第七课《司马光》和第八课《数星星的孩子》掌握得非常扎实！</p>
            </div>
          ` : filteredList.length === 0 ? `
            <div class="text-center py-10 bg-slate-50 border border-slate-200 rounded-2xl text-sm text-slate-500">
              当前筛选分类下没有题目哦 ~
            </div>
          ` : `
            <div class="space-y-4">
              ${filteredList.map((item, idx) => `
                <div class="p-4 sm:p-5 rounded-2xl border-2 transition ${
                  item.fixed ? "border-emerald-200 bg-emerald-50/30" : "border-rose-200 bg-rose-50/30"
                }">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-md bg-white border border-slate-200 text-slate-700">
                      ${item.section}
                    </span>
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${
                      item.fixed ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                    }">
                      ${item.fixed ? "✓ 已订正掌握" : "✗ 待订正"}
                    </span>
                  </div>

                  <div class="font-bold text-slate-800 text-base mb-3">
                    ${idx + 1}. ${item.questionText}
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm mb-3">
                    <div class="p-2.5 rounded-xl bg-white border border-rose-200">
                      <span class="text-xs text-slate-400 block">你的原答案：</span>
                      <span class="font-bold text-rose-600">${item.userAnswer}</span>
                    </div>
                    <div class="p-2.5 rounded-xl bg-white border border-emerald-200">
                      <span class="text-xs text-slate-400 block">参考正确答案：</span>
                      <span class="font-bold text-emerald-700">${item.correctAnswer}</span>
                    </div>
                  </div>

                  <div class="text-xs text-slate-600 bg-white/80 p-3 rounded-xl border border-slate-200/80 mb-3 leading-relaxed">
                    <span class="font-bold text-indigo-700">💡 知识点解析：</span>${item.explain}
                  </div>

                  <!-- 在线订正输入栏 -->
                  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                    <input id="fix_input_${item.uid}" type="text"
                      placeholder="照着正确答案再练写一遍，点击右侧验证订正"
                      class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                    <button onclick="verifyWrongItemFix('${item.uid}')"
                      class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition shrink-0">
                      ✓ 提交订正并验证
                    </button>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    function setWrongBookFilter(filterKey) {
      state.wrongBookFilter = filterKey;
      renderAll();
    }

    function verifyWrongItemFix(uid) {
      const item = state.wrongBook.find(w => w.uid === uid);
      const inputEl = document.getElementById(`fix_input_${uid}`);
      if (!item || !inputEl) return;

      const typed = (inputEl.value || "").trim();
      if (!typed) {
        showToast("请先在输入框中写出订正后的答案！", "warn");
        return;
      }

      const normTyped = normalizeText(typed);
      let isOk = false;
      if (item.keywords) {
        isOk = item.keywords.every(kw => typed.includes(kw));
      } else {
        isOk = (item.acceptedList || [item.correctAnswer]).some(ans => normalizeText(ans) === normTyped);
      }

      if (isOk) {
        item.fixed = true;
        saveWrongBookToLocal();
        showToast("订正正确！这道错题已标记为【已订正掌握】！", "success");
        renderAll();
      } else {
        showToast("订正还差一点点，请对照上方绿色【参考正确答案】再写一遍哦！", "warn");
      }
    }

    function copyWrongBookText() {
      if (state.wrongBook.length === 0) {
        showToast("当前没有错题需要复制哦！", "info");
        return;
      }
      const lines = [
        "【小学四年级中文第七、八课模拟考 · 专属错题本】",
        ...state.wrongBook.map((w, i) =>
          `${i + 1}. [${w.section}] ${w.questionText}\n   原答案：${w.userAnswer} ｜ 正确答案：${w.correctAnswer}\n   解析：${w.explain}`
        )
      ];
      const textArea = document.createElement("textarea");
      textArea.value = lines.join("\n\n");
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand("copy");
        showToast("错题本内容已复制到剪贴板，可直接粘贴发送！", "success");
      } catch (e) {
        showToast("复制失败，请手动选中文本复制。", "warn");
      }
      document.body.removeChild(textArea);
    }

    function retakeExam() {
      state.isSubmitted = false;
      state.gradingResult = null;
      state.timerSeconds = 0;
      state.activePart2Box = "leftRight";
      state.activePart3Left = null;
      state.activePart4Group = "xin";
      state.activePart6Blank = "p6_1";
      state.answers = {
        part1: {},
        part1Strokes: {},
        part2: { leftRight: [], topBottom: [], single: [] },
        part3: {},
        part4: { xin: [], shi: [], fei: [], dou: [] },
        part5: {},
        part6: {},
        part7: { p7_1: [], p7_2: [], p7_3: [], p7_4: [], p7_5: [] },
        part8: {},
        part9: {}
      };
      showToast("试卷已重置，加油再挑战一次满分吧！", "info");
      goToPage(1);
    }
  </script>
</body>
</html>
